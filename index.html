<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Little Surprise 💗</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#fff1f7,#f5edff);
  color:#513c49;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  overflow-x:hidden;
}

.card{
  width:100%;
  max-width:430px;
  background:rgba(255,255,255,.88);
  border-radius:28px;
  padding:30px 22px;
  text-align:center;
  box-shadow:0 15px 40px rgba(120,70,100,.15);
  position:relative;
  overflow:hidden;
}

.heart{
  position:absolute;
  font-size:24px;
  animation:float 4s infinite ease-in-out;
  opacity:.7;
}

.h1{top:15px;left:18px}
.h2{top:35px;right:20px}
.h3{bottom:25px;left:25px}
.h4{bottom:20px;right:25px}

@keyframes float{
  0%,100%{transform:translateY(0) rotate(-5deg)}
  50%{transform:translateY(-12px) rotate(5deg)}
}

.screen{
  display:none;
  animation:fade .45s ease;
}

.screen.active{
  display:block;
}

@keyframes fade{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.emoji{
  font-size:58px;
  margin-bottom:10px;
}

h1{
  font-size:28px;
  margin:8px 0 12px;
}

h2{
  font-size:23px;
  margin:10px 0 15px;
}
